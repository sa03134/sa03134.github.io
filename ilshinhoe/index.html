<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d0c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="일신회 — 말보다 기록. 세 사람의 실행과 정산을 기록하는 주간 리그.">
  <meta property="og:title" content="ILSHINHOE · 일신회">
  <meta property="og:description" content="말보다 기록. 세 사람의 실행과 정산을 기록하는 주간 리그.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://sa03134.github.io/ilshinhoe/icon-512.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=4">
  <title>ILSHINHOE · 일신회</title>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="일신회 홈">
        <img class="brand-mark" src="./icon-192.svg" alt="일신회 문장">
        <span class="brand-copy"><b>ILSHINHOE</b><small>一新會 · EXECUTE FIRST</small></span>
      </a>
      <div class="top-actions"><time id="dateLabel"></time><button id="installBtn" class="icon-btn install-btn" type="button" hidden>앱 설치</button></div>
    </header>

    <section class="quote-panel panel-brass" aria-labelledby="quoteEyebrow">
      <div class="quote-kicker" id="quoteEyebrow">TODAY'S WORD</div>
      <blockquote id="dailyQuote">기록을 불러오는 중...</blockquote>
      <div class="quote-meta"><span class="dash"></span><span id="quoteBy">일신회</span></div>
    </section>

    <section class="league-overview">
      <div><p class="eyebrow">WEEKLY LEAGUE</p><h1>말보다 기록.<br><em>기록보다 실행.</em></h1></div>
      <div class="overview-stats"><article><b id="weekCheckins">0</b><span>이번 주 체크</span></article><article><b id="activeGoals">0</b><span>활성 목표</span></article><article><b id="riskFine">0</b><span>예상 벌금</span></article></div>
    </section>

    <section class="section"><div class="section-head"><div><span class="eyebrow">ORDER</span><h2>주간 서열</h2></div><span class="section-note">체크 1회 +20 XP · 주간 목표 완수 +40 XP</span></div><div id="ranking" class="ranking panel"></div></section>

    <section class="section"><div class="section-head"><div><span class="eyebrow">MEMBERS</span><h2>멤버</h2></div><span class="section-note">프로필을 눌러 전환</span></div><div id="memberTabs" class="member-tabs"></div><div id="profile" class="profile panel"></div></section>

    <section class="section"><div class="section-head"><div><span class="eyebrow">OATHS</span><h2>서약</h2></div><span id="goalCount" class="section-note"></span></div><div id="goals" class="goal-list"></div><button id="addGoalBtn" class="wide-btn ghost-gold" type="button">+ 새 서약 추가</button></section>

    <section class="section"><div class="section-head"><div><span class="eyebrow">LEDGER</span><h2>벌금 원장</h2></div><span id="ledgerSummary" class="section-note"></span></div><div id="ledger" class="ledger panel"></div></section>

    <section class="section"><div class="section-head"><div><span class="eyebrow">HOUSE RULES</span><h2>운영 룰</h2></div></div><div class="panel rules-wrap"><div id="rules" class="rules"></div><div class="utility-row"><button id="exportBtn" class="utility-btn" type="button">원장 백업 내보내기</button><span id="syncState" class="sync-state">서버 동기화</span></div></div></section>

    <footer><img src="./icon-192.svg" alt="" aria-hidden="true"><div><b>ILSHINHOE</b><small>계속 실행하는 사람들의 기록</small></div></footer>
  </main>

  <dialog id="goalDialog"><form method="dialog" class="sheet" id="goalForm"><div class="sheet-head"><div><span class="eyebrow">OATH EDITOR</span><h3 id="dialogTitle">새 서약</h3></div><button class="close-btn" value="cancel" aria-label="닫기">×</button></div><input type="hidden" id="goalId"><label>서약명<input id="goalTitle" maxlength="80" required placeholder="예: 독서"></label><label>실천 내용<textarea id="goalDescription" placeholder="예: 책 10p 이상 읽기"></textarea></label><label>인증 방식<input id="goalProof" placeholder="예: 마지막 페이지 사진"></label><div class="field-grid"><label>주기<select id="goalCadence"><option value="daily">매일</option><option value="weekly">주간</option></select></label><label>주간 횟수<input id="goalTarget" type="number" min="1" max="7" value="1"></label></div><label>미달성 벌금<input id="goalFine" type="number" min="0" step="1000" value="10000"></label><button class="wide-btn solid-gold" value="default">저장</button><button id="deleteGoalBtn" class="wide-btn danger-btn" type="button" hidden>이 서약 삭제</button></form></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=4" defer></script>
</body>
</html>
