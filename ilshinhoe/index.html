<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="일신회 — 오늘 할 일을 체크하고, 약속과 벌금을 기록하는 실행 리그">
<meta property="og:title" content="일신회 · ILSHINHOE">
<meta property="og:description" content="오늘 할 일을 체크하고, 약속을 지키세요.">
<meta property="og:type" content="website">
<link rel="manifest" href="./manifest.webmanifest?v=11">
<link rel="icon" href="./brand-logo.svg?v=11" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css?v=11">
<title>일신회 · ILSHINHOE</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <img src="./brand-logo.svg?v=11" alt="일신회 로고" class="brand-logo">
      <div><b>일신회</b><small>ILSHINHOE</small></div>
    </div>
    <div class="top-actions">
      <span id="sync" class="sync" aria-label="서버 동기화 상태"></span>
      <button id="install" class="install" type="button" hidden>앱 설치</button>
    </div>
  </header>

  <section id="view-today" class="view active">
    <div class="page-head">
      <div>
        <small id="dateLabel"></small>
        <h1><span id="helloName">Macallan</span>의 오늘</h1>
      </div>
      <div id="levelBadge" class="level-badge">LV.1</div>
    </div>

    <div class="member-section">
      <div id="switcher" class="member-switcher"></div>
      <p class="member-hint">탭해서 전환 · 길게 눌러 ‘내 프로필’로 고정</p>
    </div>

    <div id="statusStrip" class="status-strip"></div>

    <div class="quote-row">
      <span>오늘의 한마디</span>
      <p id="quoteText">오늘 할 일을 오늘 끝낸다.</p>
    </div>

    <section class="section">
      <div class="section-head">
        <div><h2>할 일</h2><span id="goalCount"></span></div>
        <button id="addGoal" class="text-btn" type="button">추가</button>
      </div>
      <div id="goals" class="todo-list"></div>
    </section>
  </section>

  <section id="view-league" class="view">
    <div class="page-head plain">
      <div><small id="weekLabel"></small><h1>이번 주 리그</h1></div>
    </div>
    <div id="ranking" class="list-card"></div>
    <p class="helper">체크 1회 +20 XP · 주간 목표 완수 +40 XP</p>
  </section>

  <section id="view-record" class="view">
    <div class="page-head plain">
      <div><small>확정 기록</small><h1>벌금 원장</h1></div>
    </div>
    <div id="ledgerSummary" class="money-card"></div>
    <div id="ledger" class="list-card ledger-card"></div>
    <div class="manage-card">
      <button id="backup" class="manage-row" type="button"><span>데이터 백업</span><b>JSON 저장</b></button>
      <div class="manage-row static"><span>정산 규칙</span><b id="rules"></b></div>
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="메인 메뉴">
  <button class="nav active" data-view="today"><span class="nav-icon">✓</span><span>오늘</span></button>
  <button class="nav" data-view="league"><span class="nav-icon">↗</span><span>리그</span></button>
  <button class="nav" data-view="record"><span class="nav-icon">₩</span><span>원장</span></button>
</nav>

<dialog id="goalDialog">
  <form id="goalForm" class="sheet" method="dialog">
    <div class="sheet-head"><h3 id="dialogTitle">새 할 일</h3><button class="close" value="cancel" aria-label="닫기">×</button></div>
    <input type="hidden" id="goalId">
    <label class="field"><span>이름</span><input id="goalTitle" maxlength="80" required placeholder="예: 독서"></label>
    <label class="field"><span>내용</span><textarea id="goalDesc" placeholder="예: 책 10p 이상 읽기"></textarea></label>
    <label class="field"><span>인증 메모</span><input id="goalProof" placeholder="예: 마지막 페이지 사진"></label>
    <div class="two">
      <label class="field"><span>주기</span><select id="goalCadence"><option value="daily">매일</option><option value="weekly">주간</option></select></label>
      <label class="field"><span>주간 횟수</span><input id="goalTarget" type="number" min="1" max="7" value="1"></label>
    </div>
    <label class="field"><span>미달성 벌금</span><input id="goalFine" type="number" min="0" step="1000" value="10000"></label>
    <button class="save" value="default">저장</button>
    <button id="deleteGoal" class="delete" type="button" hidden>이 할 일 종료</button>
  </form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.js?v=11" defer></script>
</body>
</html>
