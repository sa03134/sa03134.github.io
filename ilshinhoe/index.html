<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164A3B"><meta property="og:title" content="ILSHINHOE · 일신회"><meta property="og:description" content="세 사람이 함께 만드는 목표 리그"><title>ILSHINHOE · 일신회</title><style>:root{--b:#164A3B;--s:#EAF2EF;--bg:#F5F7F5;--t:#111815;--m:#6A7570;--l:#E2E8E5;--d:#963C35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:720px;margin:auto;padding:18px 15px 80px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.seal,.av{display:grid;place-items:center;background:var(--b);color:#fff;font-weight:900}.seal{width:42px;height:42px;border-radius:13px}.brand b{letter-spacing:.05em}.brand small,.muted{color:var(--m);font-size:11px}.hero{margin-top:16px;background:var(--b);color:#fff;border-radius:24px;padding:22px}.hero h1{font-size:28px;line-height:1.08;margin:6px 0}.hero p{font-size:12px;opacity:.75}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.stats div{background:#ffffff14;border-radius:14px;padding:11px}.stats b{display:block;font-size:18px}.stats span{font-size:9px;opacity:.75}.sec{margin-top:20px}.sh{display:flex;justify-content:space-between;align-items:end;margin:0 2px 9px}.sh h2{font-size:17px;margin:0}.card{background:#fff;border:1px solid var(--l);border-radius:19px;box-shadow:0 10px 28px #17342c0a}.rank{padding:5px 14px}.rr{display:grid;grid-template-columns:24px 42px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.rr:last-child{border:0}.av{width:42px;height:42px;border-radius:50%;background:var(--s);color:var(--b);border:1px solid #d5e4de}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{min-width:145px;background:#fff;border:1px solid var(--l);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center;text-align:left}.tab.on{border-color:var(--b);box-shadow:inset 0 0 0 1px var(--b)}.tab .av{width:36px;height:36px}.profile{padding:16px}.ph{display:flex;gap:11px;align-items:center}.ph .av{width:56px;height:56px;font-size:22px}.pm{flex:1}.pm h3{margin:0}.lv{background:var(--s);color:var(--b);font-weight:900;font-size:11px;border-radius:999px;padding:7px 9px}.bar{height:7px;background:#EDF1EF;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.profile>.bar{margin-top:13px}.mins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.mins div{background:#F7F9F8;border-radius:13px;padding:9px}.mins b{display:block}.mins span{color:var(--m);font-size:9px}.goals{display:grid;gap:9px}.goal{padding:14px}.gh{display:flex;gap:9px}.gm{flex:1}.gt{font-weight:900}.tag{font-size:9px;color:var(--b);background:var(--s);border-radius:99px;padding:3px 6px;margin-left:5px}.desc{color:var(--m);font-size:10px;line-height:1.5;margin-top:5px}.fine{font-size:10px;color:var(--d);font-weight:900}.prog{display:flex;gap:8px;align-items:center;margin-top:11px}.prog .bar{flex:1}.acts{display:grid;grid-template-columns:1fr 43px;gap:7px;margin-top:10px}.check,.add,.save{border:0;background:var(--b);color:#fff;font-weight:900;border-radius:12px;padding:12px}.check.done{background:var(--s);color:var(--b)}.edit{border:1px solid var(--l);background:#fff;border-radius:12px}.add{width:100%;margin-top:9px;background:var(--s);color:var(--b);border:1px dashed #a6beb5}.rules{padding:15px;color:#53605b;font-size:11px;line-height:1.6;white-space:pre-line}dialog{border:0;padding:0;border-radius:24px 24px 0 0;width:min(720px,100%);max-width:none;margin:auto 0 0}dialog::backdrop{background:#0b1d1790}.sheet{padding:17px 17px 28px;max-height:88vh;overflow:auto}.f{margin-bottom:10px}.f label{display:block;font-size:10px;color:var(--m);font-weight:900;margin-bottom:5px}.f input,.f textarea,.f select{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;background:#fff}.f textarea{min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save,.del{width:100%}.del{margin-top:7px;padding:11px;border:1px solid #ead5d2;background:#fff;color:var(--d);border-radius:12px;font-weight:800}@media(min-width:600px){.goals{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><header class="top"><div class="brand"><div class="seal">I</div><div><b>ILSHINHOE</b><br><small>일신회 · Better, together.</small></div></div><small id="date"></small></header><section class="hero"><small>WEEKLY LEAGUE</small><h1>이번 주도,<br>말보다 기록.</h1><p>각자의 약속을 체크하고 XP를 쌓아 레벨을 올리세요.</p><div class="stats"><div><b id="wd">0</b><span>이번 주 체크</span></div><div><b id="ag">0</b><span>활성 목표</span></div><div><b id="rf">0</b><span>벌금 위험</span></div></div></section><section class="sec"><div class="sh"><h2>주간 랭킹</h2><span class="muted">체크 1회 = 20 XP</span></div><div class="card rank" id="rank"></div></section><section class="sec"><div class="sh"><h2>멤버</h2><span class="muted">프로필을 눌러 전환</span></div><div class="tabs" id="tabs"></div><div class="card profile" id="profile"></div></section><section class="sec"><div class="sh"><h2>나의 서약</h2><span class="muted" id="gc"></span></div><div class="goals" id="goals"></div><button class="add" id="add">+ 새 목표 만들기</button></section><section class="sec"><div class="sh"><h2>운영 룰</h2><span class="muted">일신회 공통</span></div><div class="card rules" id="rules"></div></section></main><dialog id="dlg"><div class="sheet"><h3 id="st">새 목표</h3><form id="form"><input type="hidden" id="gid"><div class="f"><label>목표명</label><input id="title" required></div><div class="f"><label>실천 내용</label><textarea id="desc"></textarea></div><div class="f"><label>인증 방식</label><input id="proof"></div><div class="two"><div class="f"><label>주기</label><select id="cad"><option value="daily">매일</option><option value="weekly">주간</option></select></div><div class="f"><label>주간 횟수</label><input id="target" type="number" min="1" max="7" value="1"></div></div><div class="f"><label>미달성 벌금</label><input id="fine" type="number" min="0" step="1000" value="10000"></div><button class="save">저장하기</button><button type="button" class="del" id="del" hidden>이 목표 삭제</button></form></div></dialog><script>const U='https://kpotsnjhysgrhlnlhdnz.supabase.co',K='sb_publishable_DghWWFFdMmpY84PlZG7lMw_a0mKXqeX',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},S={m:[],g:[],c:[],s:{},id:'son-jeongwoo'},$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const ds=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function mon(d=new Date()){d=new Date(d);d.setDate(d.getDate()-((d.getDay()+6)%7));d.setHours(0,0,0,0);return d}function ad(d,n){d=new Date(d);d.setDate(d.getDate()+n);return d}const won=n=>new Intl.NumberFormat('ko-KR').format(n)+'원';async function api(p,o={}){let r=await fetch(U+'/rest/v1/'+p,{...o,headers:{...H,...o.headers}}),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}const gs=id=>S.g.filter(g=>g.member_id===id&&g.active),cs=id=>S.c.filter(c=>c.goal_id===id),wc=id=>{let a=ds(mon()),b=ds(ad(mon(),6));return S.c.filter(c=>c.goal_id===id&&c.check_date>=a&&c.check_date<=b)};function xp(id,all=false){let x=0;gs(id).forEach(g=>{let n=(all?cs(g.id):wc(g.id)).length;x+=n*20;if(!all&&g.cadence==='weekly'&&n>=g.target_count)x+=40});return x}const lv=x=>Math.floor(x/120)+1;function streak(id){let a=[...new Set(gs(id).flatMap(g=>cs(g.id).map(c=>c.check_date)))].sort().reverse();if(!a.length)return 0;let d=new Date();if(a[0]!=ds(d)){d.setDate(d.getDate()-1);if(a[0]!=ds(d))return 0}let s=0;for(let v of a){if(v==ds(d)){s++;d.setDate(d.getDate()-1)}else break}return s}function risk(id){let n=new Date(),el=((n.getDay()+6)%7)+1,t=0;gs(id).forEach(g=>{if(g.cadence==='daily'){let a=ds(mon()),b=ds(n),d=S.c.filter(c=>c.goal_id===g.id&&c.check_date>=a&&c.check_date<=b).length;t+=Math.max(0,el-d)*g.fine_amount}else if(n.getDay()===0&&wc(g.id).length<g.target_count)t+=g.fine_amount});return t}function render(){date.textContent=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(new Date());let a=ds(mon()),b=ds(ad(mon(),6));wd.textContent=S.c.filter(c=>c.check_date>=a&&c.check_date<=b).length;ag.textContent=S.g.filter(g=>g.active).length;rf.textContent=won(S.m.reduce((x,m)=>x+risk(m.id),0)).replace('원','');let r=[...S.m].sort((a,b)=>xp(b.id)-xp(a.id));rank.innerHTML=r.map((m,i)=>`<div class="rr"><b>${i+1}</b><div class="av">${m.display_name[0]}</div><div><b>${m.display_name}</b><br><small class="muted">Lv.${lv(xp(m.id,true))} · ${streak(m.id)}일 연속</small></div><b style="color:var(--b)">${xp(m.id)} XP</b></div>`).join('');tabs.innerHTML=S.m.map(m=>`<button class="tab ${m.id===S.id?'on':''}" data-m="${m.id}"><div class="av">${m.display_name[0]}</div><div><b>${m.display_name}</b><br><small class="muted">Lv.${lv(xp(m.id,true))}</small></div></button>`).join('');let m=S.m.find(x=>x.id===S.id)||S.m[0];if(!m)return;let x=xp(m.id,true);profile.innerHTML=`<div class="ph"><div class="av">${m.display_name[0]}</div><div class="pm"><h3>${m.display_name}</h3><small class="muted">ILSHINHOE MEMBER · ${xp(m.id)} XP this week</small></div><div class="lv">LV.${lv(x)}</div></div><div class="bar"><i style="width:${Math.round((x%120)/120*100)}%"></i></div><div class="mins"><div><b>${streak(m.id)}일</b><span>연속 기록</span></div><div><b>${xp(m.id)} XP</b><span>주간 경험치</span></div><div><b>${won(risk(m.id)).replace('원','')}</b><span>벌금 위험</span></div></div>`;let gl=gs(m.id);gc.textContent=gl.length+'개 활성';goals.innerHTML=gl.length?gl.map((g,i)=>{let p=g.cadence==='daily'?(S.c.some(c=>c.goal_id===g.id&&c.check_date===ds())?1:0):wc(g.id).length,t=g.cadence==='daily'?1:g.target_count,d=p>=t;return `<article class="card goal"><div class="gh"><div class="gm"><div class="gt">${g.title}<span class="tag">${g.cadence==='daily'?'매일':'주 '+g.target_count+'회'}</span></div><div class="desc">${g.description||'세부 내용 없음'}${g.proof_method?'<br>인증 · '+g.proof_method:''}</div></div><div class="fine">-${won(g.fine_amount)}</div></div><div class="prog"><div class="bar"><i style="width:${Math.min(100,p/t*100)}%"></i></div><small>${p}/${t}</small></div><div class="acts"><button class="check ${d?'done':''}" data-c="${g.id}">${d&&g.cadence==='daily'?'✓ 오늘 완료':g.cadence==='daily'?'오늘 완료 체크':'+ 1회 기록'}</button><button class="edit" data-e="${g.id}">⋯</button></div></article>`}).join(''):'<div class="card rules">아직 목표가 없습니다.</div>';rules.textContent=S.s.group_rules||'매주 일요일 자정 정산';$$('[data-m]').forEach(b=>b.onclick=()=>{S.id=b.dataset.m;render()});$$('[data-c]').forEach(b=>b.onclick=()=>check(b.dataset.c));$$('[data-e]').forEach(b=>b.onclick=()=>openGoal(S.g.find(g=>g.id===b.dataset.e)))}async function check(id){let g=S.g.find(x=>x.id===id),e=S.c.find(c=>c.goal_id===id&&c.check_date===ds());if(e&&g.cadence==='daily')await api('goal_checkins?id=eq.'+e.id,{method:'DELETE'});else if(!e)await api('goal_checkins',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({goal_id:id,check_date:ds(),note:''})});await load()}function openGoal(g){form.reset();gid.value=g?.id||'';st.textContent=g?'목표 수정':'새 목표';title.value=g?.title||'';desc.value=g?.description||'';proof.value=g?.proof_method||'';cad.value=g?.cadence||'daily';target.value=g?.target_count||1;fine.value=g?.fine_amount||10000;del.hidden=!g;dlg.showModal()}add.onclick=()=>openGoal();form.onsubmit=async e=>{e.preventDefault();let id=gid.value,p={member_id:S.id,title:title.value,description:desc.value,proof_method:proof.value,cadence:cad.value,target_count:+target.value||1,fine_amount:+fine.value||0,active:true};await api(id?'goals?id=eq.'+id:'goals',{method:id?'PATCH':'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(p)});dlg.close();load()};del.onclick=async()=>{if(gid.value&&confirm('이 목표를 삭제할까요?')){await api('goals?id=eq.'+gid.value,{method:'DELETE'});dlg.close();load()}};async function load(){let st=ds(ad(new Date(),-90)),v=await Promise.all([api('members?select=*&order=created_at.asc'),api('goals?select=*&order=sort_order.asc,created_at.asc'),api('goal_checkins?select=*&check_date=gte.'+st),api('settings?select=*')]);S.m=v[0]||[];S.g=v[1]||[];S.c=v[2]||[];S.s=Object.fromEntries((v[3]||[]).map(x=>[x.key,x.value]));render()}load();</script></body></html>
